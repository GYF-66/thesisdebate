name: 功能建议
description: 分享使用场景、体验改进或新功能需求
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与遇到的问题
      description: 说明正在完成什么任务，以及目前哪里不方便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或改进的功能
      description: 描述期望的操作过程和最终效果，可附草图或截图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方法
      description: 可选。现有工具或手工步骤有什么不足？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。文档类型、适用人群、参考资料或其他约束。
